name: Lint and Template Chart

on:
  pull_request:
  push:
    branches:
      - main

# Fork PRs run with a read-only token and no secrets. Keep it that way:
# never switch this workflow to pull_request_target.
permissions:
  contents: read

jobs:
  validate:
    name: Lint & Template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: 'v4.3.1'

      - name: Lint chart
        run: helm lint . --strict

      - name: Template chart (defaults)
        run: helm template home-assistant . --namespace home-assistant > /tmp/default.yaml

      - name: Template chart (all sidecars enabled)
        run: |
          helm template home-assistant . --namespace home-assistant \
            --set backupShipper.enabled=true \
            --set backupLocation.enabled=true \
            --set matter.enabled=true \
            --set matter.existingSecret=matter-token \
            --set pythonMatterServer.enabled=true \
            --set ingress.enabled=true \
            --set ingress.host=home-assistant.example.com \
            > /tmp/full.yaml

      - name: Reject pre-0.3.0 flat sidecar image keys
        run: |
          if helm template home-assistant . --set backupShipper.repository=example >/dev/null 2>&1; then
            echo "::error::flat sidecar image keys must fail rendering (moved under <sidecar>.image)"
            exit 1
          fi

      - name: Install kubeconform
        run: |
          curl -sSLo /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.4/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin

      - name: Validate manifests
        run: |
          kubeconform -strict -summary -ignore-missing-schemas /tmp/default.yaml
          kubeconform -strict -summary -ignore-missing-schemas /tmp/full.yaml
