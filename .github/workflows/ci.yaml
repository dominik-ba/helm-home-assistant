name: Lint and Template Chart

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Lint & Template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.21.4'

      - name: Lint chart
        run: helm lint . --strict

      - name: Template chart (defaults)
        run: helm template home-assistant . --namespace home-assistant > /tmp/default.yaml

      - name: Template chart (all sidecars enabled)
        run: |
          helm template home-assistant . --namespace home-assistant \
            --set backupShipper.enabled=true \
            --set backupLocation.enabled=true \
            --set matter.enabled=true \
            --set matter.existingSecret=matter-token \
            --set pythonMatterServer.enabled=true \
            --set ingress.enabled=true \
            --set ingress.host=home-assistant.example.com \
            > /tmp/full.yaml

      - name: Install kubeconform
        run: |
          curl -sSLo /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.4/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin

      - name: Validate manifests
        run: |
          kubeconform -strict -summary -ignore-missing-schemas /tmp/default.yaml
          kubeconform -strict -summary -ignore-missing-schemas /tmp/full.yaml
