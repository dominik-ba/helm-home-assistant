name: Release Chart

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  release:
    name: Package & Push to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: 'v4.3.0'

      - name: Verify tag matches Chart.yaml version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          chart_version=$(grep '^version:' Chart.yaml | awk '{print $2}')
          if [ "$tag_version" != "$chart_version" ]; then
            echo "::error::Tag v$tag_version does not match Chart.yaml version $chart_version"
            exit 1
          fi

      - name: Lint chart
        run: helm lint . --strict

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package chart
        run: helm package .

      - name: Push chart to GHCR
        run: helm push home-assistant-*.tgz oci://ghcr.io/dominik-ba/charts
